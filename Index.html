function signin(){return `<section class="sheet"><div class="card" style="max-width:28rem;margin:2rem auto"><h2>Sign in</h2><p class="muted">New here? <a href="#open" style="color:var(--crimson);font-weight:700">Create one free</a></p><form id="in"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><p id="msg" class="err"></p><button class="solid" style="width:100%;margin-top:1rem">Sign in</button></form></div></section>`;}
function openAccount(){
  const s=signup;
  const money=(MONEY[s.country]||["",""]);
  const titles=["ACCOUNT DETAILS","PERSONAL INFORMATION","ADDRESS & LOCATION","SET YOUR PASSWORD"];
  const dots=[0,1,2,3].map(i=>{
    const cls=i<s.step?"sdot done":i===s.step?"sdot on":"sdot";
    const line=i<3?`<span class="sline${i<s.step?" done":""}"></span>`:"";
    return `<span class="${cls}">${i<s.step?"✓":i+1}</span>${line}`;
  }).join("");
  const opt=(list,val,blank)=>`<option value="">${blank}</option>`+list.map(x=>`<option${x===val?" selected":""}>${x}</option>`).join("");
  const lab=(name,inner,req)=>`<label>${name}${req?' <span style="color:var(--crimson)">*</span>':""}${inner}</label>`;
  const inp=(id,val,ph,type)=>`<input name="${id}" type="${type||"text"}" value="${esc(val)}" placeholder="${ph||""}" ${id==="currency"||id==="symbol"?"readonly":""}>`;
  let fields="";
  if(s.step===0){
    fields=lab("Account type",`<select name="type">${opt(["Checking","Savings","Current Account","Premier Plus","Business Account"],s.type,"Select account type")}</select>`,1)
      +lab("Email address",inp("email",s.email,"you@example.com","email"),1)
      +lab("Country",`<select name="country" onchange="keepSignup();render()">${opt(["United States","United Kingdom","United Arab Emirates","Canada","Nigeria","Ghana","Other"],s.country,"Select country")}</select>`,1)
      +lab("Base currency",inp("currency",money[0],"Auto-filled"),1)
      +lab("Currency symbol",inp("symbol",money[1],"Auto-filled"),1);
  }else if(s.step===1){
    fields=lab("First name",inp("first",s.first,"John"),1)
      +lab("Last name",inp("last",s.last,"Doe"),1)
      +lab("Middle name",inp("middle",s.middle,"Optional"))
      +lab("Gender",`<select name="gender">${opt(["Female","Male","Prefer not to say"],s.gender,"Select")}</select>`,1)
      +lab("Date of birth",inp("dob",s.dob,"","date"),1)
      +lab("Phone number",inp("phone",s.phone,"+1 555 000 0000"),1)
      +lab("Employment status",`<select name="job">${opt(["Employed","Self-employed","Student","Retired","Unemployed"],s.job,"Select")}</select>`,1);
  }else if(s.step===2){
    fields=lab("Street address",inp("street",s.street,"123 Main Street"),1)
      +lab("City",inp("city",s.city,"New York"),1)
      +lab("State / Province",inp("region",s.region,"NY"),1)
      +lab("ZIP / Postal code",inp("zip",s.zip,"10001"),1);
  }else{
    const n=s.password.length===0?0:s.password.length<8?1:s.password.length<12?2:3;
    const label=["Enter a password","Too short","Fair","Strong"][n];
    fields=lab("Password",`<span style="position:relative;display:block">${inp("password",s.password,"Min. 8 characters",s.show?"text":"password")}<button type="button" style="position:absolute;right:.7rem;top:1.7rem;border:0;background:transparent" onclick="signup.show=!signup.show;keepSignup();render()">${s.show?"hide":"show"}</button></span>`,1)
      +`<div class="bars">${[0,1,2,3].map(i=>`<i class="${i<n?"on":""}"></i>`).join("")}</div><p class="muted">${label}</p>`
      +lab("Confirm password",inp("confirm",s.confirm,"Repeat password",s.show?"text":"password"),1)
      +`<label class="robot"><input type="checkbox" name="human" ${s.human?"checked":""} style="width:auto"> I'm not a robot</label>`;
  }
  return `<main style="min-height:100svh;background:#eef0f4;padding:1.2rem .8rem 2rem"><div class="wiz">
    <a class="brand" href="#home" style="color:var(--ink)"><span class="mark">▣</span> Apex Trust Bank</a>
    <p class="eye" style="margin-top:1.4rem">Get started</p>
    <h1>Create your account</h1>
    <p class="muted">Already have an account? <a href="#signin" style="color:var(--crimson);font-weight:700">Sign in here</a></p>
    <div class="stepper">${dots}</div>
    <h2 class="wh">${titles[s.step]}</h2>
    <form id="up">${fields}<p id="msg" class="err">${s.error||""}</p>
      <button class="wgo" type="submit">${s.step===3?"Create account ✓":"Continue →"}</button>
      ${s.step?`<button class="wback" type="button" onclick="keepSignup();signup.step--;signup.error='';render()">← Back</button>`:""}
    </form>
    ${s.step===3?`<p class="muted" style="text-align:center;margin-top:1rem">By creating an account you agree to our <a href="#policies" style="color:var(--crimson);font-weight:700">Terms of Service</a> and <a href="#policies" style="color:var(--crimson);font-weight:700">Privacy Policy</a>.</p>`:""}
  </div></main>`;
}
function keepSignup(){
  const form=document.getElementById("up");
  if(!form)return;
  const d=new FormData(form);
  ["type","email","country","first","last","middle","gender","dob","phone","job","street","city","region","zip","password","confirm"].forEach(k=>{
    if(d.has(k))signup[k]=String(d.get(k)||"");
  });
  if(signup.step===3)signup.human=form.querySelector('[name="human"]')?.checked||false;
}
function shell(inner){
  const initials=state.profile.name.split(" ").slice(0,2).map(p=>p[0]||"").join("").toUpperCase();
  return `<div class="app"><div class="top"><a class="mark" href="#dash">▣</a><button class="icon" style="color:#6b7280" onclick="document.getElementById('dmenu').classList.remove('hidden')">☰</button><span style="margin-left:auto" class="badge">${initials}</span><button class="icon" style="color:var(--crimson)" onclick="signOut()">⎋</button></div>
  <div id="dmenu" class="menu hidden"><nav class="drawer"><button onclick="document.getElementById('dmenu').classList.add('hidden')">Close</button><a href="#dash">Dashboard</a><a href="#summary">Account Summary</a><a href="#send">Send Money</a><a href="#transfer">Transfer</a><a href="#bills">Pay Bills</a><a href="#history">Transaction History</a><a href="#check">Deposit Check</a><a href="#crypto">Deposit Crypto</a><a href="#loans">Loans</a><a href="#mycards">Cards</a><a href="#kyc">KYC</a><a href="#profile">Profile</a><a href="#support">Support</a><button style="color:var(--crimson);font-weight:700" onclick="signOut()">Sign Out</button></nav><button class="scrim" onclick="document.getElementById('dmenu').classList.add('hidden')"></button></div>
  <div class="page">${inner}</div></div>`;
}
function hello(){const h=new Date().getHours();return (h<12?"Good Morning":h<17?"Good Afternoon":"Good Evening")+", "+state.profile.name;}
function txList(rows){if(!rows.length)return `<p class="muted">No transactions.</p>`;return rows.map(tx=>`<a class="tx" href="#receipt/${tx.id}"><span><b class="${tx.amount<0?"neg":"pos"}">${money(tx.amount)}</b><br><span class="muted">${tx.beneficiary}</span></span><span>${tx.status}</span></a>`).join("");}
function dash(){const a=state.account,loan=state.loans[0];return shell(`<h2 style="margin:0">Dashboard</h2><p class="muted">${hello()}</p><section class="balance"><div class="split"><span>Total Balance</span><button class="ghost" onclick="go('send')">Transfer</button></div><p class="amt">${money(a.balance)} <button style="border:0;background:transparent;color:#fff" onclick="state.hide=!state.hide;save();render()">${state.hide?"show":"hide"}</button></p><div class="meta"><div>Linked<br>Cards<br><b>${state.cards.length}</b></div><div>Account<br>Holder<br><b>${state.profile.name}</b></div><div>Network<br><b>This device</b></div></div></section><article class="card" style="margin-top:.8rem"><div class="split"><b>Current Account</b><span class="muted">Primary</span></div><p class="muted">Account Number</p><a class="blue" href="#summary">${a.number}</a><p class="muted">Available Balance</p><p style="font-size:1.45rem;font-weight:750;margin:.2rem 0">${money(a.balance)}</p><div class="split"><span class="muted">Account Type</span><b>Current Account</b></div><div class="split"><span class="muted">Status</span><span class="badge">${a.status}</span></div></article><a class="card" style="display:block;margin-top:.8rem" href="#loans"><b>Loan</b><p class="muted">${loan?loan.product+" · "+loan.status:"No active loan"}</p></a><h3>Shortcuts</h3><div class="row"><a class="card" href="#send">Send Money</a><a class="card" href="#bills">Pay Bills</a><a class="card" href="#history">Transaction History</a></div><h3>Recent Transactions</h3><div class="card">${txList(state.txs.slice(0,5))}</div>`);}
function formPage(title,lede,fields,id){return shell(`<form id="${id}" class="card"><h3>${title}</h3><p class="muted">${lede}</p>${fields}<p id="msg"></p><button class="solid" style="margin-top:.8rem">Continue</button></form>`);}
function summary(){return shell(`<h3>Account Summary</h3><article class="card"><b>Current Account</b><p class="blue">${state.account.number}</p><p style="font-size:1.5rem;font-weight:750">${money(state.account.balance)}</p><span class="badge">${state.account.status}</span></article>`);}
function history(){return shell(`<h3>Transaction History</h3><div class="card">${txList(state.txs)}</div>`);}
function mycards(){const list=state.cards.map(c=>`<div class="card" style="background:#0a1628;color:#fff;margin-top:.6rem"><small>${c.brand}</small><p style="font-family:monospace">•••• ${c.last4}</p></div>`).join("")||`<p class="muted">You haven't added any cards yet.</p>`;return shell(`<div class="split"><h3>My Cards</h3><button class="solid" onclick="addCard()">Add card</button></div>${list}`);}
function addCard(){state.cards.unshift({brand:"Essential Debit",last4:String(1000+Math.floor(Math.random()*9000))});save();render();}
function loans(){return shell(`<h3>Loans</h3><form id="loan" class="card"><label>Product<select name="product"><option>Personal loan</option><option>Auto loan</option><option>Home mortgage</option></select></label><label>Amount<input name="amount" type="number" required></label><button class="solid" style="margin-top:.8rem">Apply</button></form>${state.loans.map(l=>`<p>${l.product} · ${money(l.amount)} · ${l.status}</p>`).join("")}`);}
function profile(){const p=state.profile;return shell(`<h3>Profile</h3><form id="profile" class="card"><label>Name<input name="name" value="${esc(p.name)}"></label><label>Email<input name="email" value="${esc(p.email)}"></label><label>Phone<input name="phone" value="${esc(p.phone)}"></label><button class="solid" style="margin-top:.8rem">Save</button><p id="msg"></p></form>`);}
function support(){return shell(`<h3>Support</h3><form id="support" class="card"><label>Subject<input name="subject" required></label><label>Message<textarea name="message" required></textarea></label><button class="solid" style="margin-top:.8rem">Send</button><p id="msg"></p></form>`);}
function kyc(){return shell(`<h3>KYC</h3><p>Status: ${state.kyc||"Unverified"}</p><form id="kyc" class="card"><label>Government ID<input name="id" required></label><button class="solid" style="margin-top:.8rem">Submit</button><p id="msg"></p></form>`);}
function receipt(id){const tx=state.txs.find(t=>t.id===id);if(!tx)return shell(`<h3>Receipt not found</h3>`);return shell(`<h3>Transaction Receipt</h3><p class="muted">Reference #${tx.id}</p><div class="card"><p class="split"><span>Amount</span><b class="${tx.amount<0?"neg":"pos"}">${money(tx.amount)}</b></p><p class="split"><span>Status</span><b>${tx.status}</b></p><p class="split"><span>Date</span><b>${tx.at}</b></p><p class="split"><span>Type</span><b>${tx.type}</b></p><p class="split"><span>Beneficiary</span><b>${tx.beneficiary}<br><span class="muted">${tx.bank}</span></b></p><p class="split"><span>Description</span><b>${tx.description}</b></p></div>`);}
function signOut(){
  state.signedIn=false;
  state.uid="";
  localStorage.setItem(KEY,JSON.stringify(state));
  if(useCloud && auth.currentUser) auth.signOut();
  go("home");
}
function spend(amount,tx){if(!(amount>0))return "Enter an amount greater than zero.";if(state.account.balance<amount)return "Not enough money in Current Account.";state.account.balance=Math.round((state.account.balance-amount)*100)/100;state.txs.unshift(tx);save();return "";}
function credit(amount,tx){if(!(amount>0))return "Enter an amount greater than zero.";state.account.balance=Math.round((state.account.balance+amount)*100)/100;state.txs.unshift(tx);save();return "";}
const APP=new Set(["dash","summary","send","transfer","bills","history","check","crypto","loans","mycards","kyc","profile","support"]);
function render(){
  const r=route();
  const app=APP.has(r)||r.startsWith("receipt/");
  document.getElementById("siteHead").classList.toggle("hidden",(app&&state.signedIn)||r==="open");
  document.getElementById("mnav").classList.add("hidden");
  const view=document.getElementById("view");
  if(app&&!state.signedIn){go("signin");return;}
  if(r==="home"||r==="")view.innerHTML=home();
  else if(r==="signin")view.innerHTML=signin();
  else if(r==="open")view.innerHTML=openAccount();
  else if(r==="services")view.innerHTML=services();
  else if(r==="about")view.innerHTML=about();
  else if(r==="cards")view.innerHTML=cardsPage();
  else if(r==="contact")view.innerHTML=contact();
  else if(r==="policies")view.innerHTML=policies();
  else if(r==="faq"){view.innerHTML=home();setTimeout(()=>{const el=document.getElementById("faq");if(el)el.scrollIntoView();},30);}
  else if(r==="dash")view.innerHTML=dash();
  else if(r==="summary")view.innerHTML=summary();
  else if(r==="send"||r==="transfer")view.innerHTML=formPage(r==="transfer"?"Transfer":"Send Money","Available "+money(state.account.balance),`<label>Beneficiary<input name="name" required></label><label>Account<input name="account" required></label><label>Amount<input name="amount" type="number" step="0.01" required></label><label>Description<input name="description"></label>`,"pay");
  else if(r==="bills")view.innerHTML=formPage("Pay Bills","Pay a biller from Current Account.",`<label>Biller<input name="biller" required></label><label>Amount<input name="amount" type="number" step="0.01" required></label><label>Reference<input name="reference"></label>`,"bill");
  else if(r==="check")view.innerHTML=formPage("Deposit","This adds money to your current account.",`<label>Amount<input name="amount" type="number" step="0.01" required></label><label>Note<input name="note" placeholder="Cash, check, or transfer in"></label>`,"check");
  else if(r==="crypto")view.innerHTML=formPage("Deposit Crypto","Amount is added to your balance in your account currency.",`<label>Asset<select name="asset"><option>USDT</option><option>BTC</option><option>ETH</option></select></label><label>Amount<input name="amount" type="number" step="0.01" required></label>`,"crypto");
  else if(r==="history")view.innerHTML=history();
  else if(r==="mycards")view.innerHTML=mycards();
  else if(r==="loans")view.innerHTML=loans();
  else if(r==="profile")view.innerHTML=profile();
  else if(r==="support")view.innerHTML=support();
  else if(r==="kyc")view.innerHTML=kyc();
  else if(r.startsWith("receipt/"))view.innerHTML=receipt(r.split("/")[1]);
  else view.innerHTML=home();
  bind();
}
function bind(){
  const on=(id,fn)=>{const el=document.getElementById(id);if(el)el.onsubmit=(e)=>{e.preventDefault();fn(new FormData(el));};};
  on("in",(d)=>{
    const email=String(d.get("email")||"").trim();
    const password=String(d.get("password")||"");
    const fail=(text)=>{const msg=document.getElementById("msg"); if(msg) msg.textContent=text;};
    if(!useCloud){state.profile.email=email||state.profile.email; state.signedIn=true; save(); go("dash"); return;}
    auth.signInWithEmailAndPassword(email, password).then((cred)=>loadCloudUser(cred.user.uid)).catch((err)=>fail(err.message));
  });
  on("up",()=>{
    keepSignup();
    const s=signup;
    const missing=s.step===0?!s.type||!s.email||!s.country:s.step===1?!s.first||!s.last||!s.gender||!s.dob||!s.phone||!s.job:s.step===2?!s.street||!s.city||!s.region||!s.zip:s.password.length<8||s.password!==s.confirm||!s.human;
    if(s.step===3&&s.password.length<8){s.error="Password must be at least 8 characters.";render();return;}
    if(s.step===3&&s.password!==s.confirm){s.error="Passwords do not match.";render();return;}
    if(s.step===3&&!s.human){s.error="Confirm you are not a robot.";render();return;}
    if(missing){s.error="Fill in the required fields.";render();return;}
    s.error="";
    if(s.step<3){s.step++;render();return;}
    const finish=()=>{
      state.profile.name=[s.first,s.middle,s.last].filter(Boolean).join(" ");
      state.profile.email=s.email;
      state.profile.phone=s.phone;
      state.signedIn=true;
      save();
      go("dash");
    };
    if(!useCloud){finish();return;}
    auth.createUserWithEmailAndPassword(s.email, s.password).then((cred)=>{
      const code=MONEY[s.country]||["USD","$"];
      state.uid=cred.user.uid;
      state.profile.name=[s.first,s.middle,s.last].filter(Boolean).join(" ");
      state.profile.email=s.email;
      state.profile.phone=s.phone;
      state.currency=code[0];
      state.account={number:String(2000000000+Math.floor(Math.random()*700000000)),balance:0,status:"Active"};
      state.txs=[];
      state.cards=[];
      state.loans=[];
      state.kyc="Unverified";
      state.signedIn=true;
      return db.collection("users").doc(cred.user.uid).set({
        name: state.profile.name,
        email: s.email,
        phone: s.phone,
        country: s.country,
        currency: state.currency,
        accountType: s.type,
        address: {street:s.street, city:s.city, region:s.region, zip:s.zip},
        account: state.account,
        txs: [],
        cards: [],
        loans: []
      });
    }).then(()=>{localStorage.setItem(KEY,JSON.stringify(state)); go("dash");}).catch((err)=>{s.error=err.message; render();});
  });
  on("contact",()=>{document.getElementById("msg").innerHTML='<span class="ok">Message saved in this browser only.</span>';});
  on("pay",(d)=>{const amount=Number(d.get("amount"));const id=rid();const err=spend(amount,{id,amount:-amount,status:"Successful",at:new Date().toISOString(),type:route()==="transfer"?"Wire":"Intra-Bank",beneficiary:String(d.get("name")),bank:"Apex Trust Bank • "+d.get("account"),description:String(d.get("description")||"Transfer")});const msg=document.getElementById("msg");if(msg)msg.innerHTML=err?`<span class="err">${err}</span>`:`<span class="ok">Saved. <a href="#receipt/${id}">View receipt</a></span>`;});
  on("bill",(d)=>{const amount=Number(d.get("amount"));const id=rid();const err=spend(amount,{id,amount:-amount,status:"Successful",at:new Date().toISOString(),type:"Bill payment",beneficiary:String(d.get("biller")),bank:"Apex Trust Bank • Bills",description:String(d.get("reference")||"Bill")});const msg=document.getElementById("msg");if(msg)msg.innerHTML=err?`<span class="err">${err}</span>`:`<span class="ok">Saved. <a href="#receipt/${id}">View receipt</a></span>`;});
  on("check",(d)=>{const amount=Number(d.get("amount"));const id=rid();const err=credit(amount,{id,amount,status:"Successful",at:new Date().toISOString(),type:"Deposit",beneficiary:"Deposit",bank:"Apex Trust Bank",description:String(d.get("note")||"Deposit")});const msg=document.getElementById("msg");if(msg)msg.innerHTML=err?`<span class="err">${err}</span>`:`<span class="ok">Added to your balance. <a href="#receipt/${id}">View receipt</a></span>`;});
  on("crypto",(d)=>{const amount=Number(d.get("amount"));const id=rid();const err=credit(amount,{id,amount,status:"Successful",at:new Date().toISOString(),type:"Crypto deposit",beneficiary:String(d.get("asset")),bank:"Apex Trust Bank • Crypto",description:"Crypto deposit"});const msg=document.getElementById("msg");if(msg)msg.innerHTML=err?`<span class="err">${err}</span>`:`<span class="ok">Added to your balance. <a href="#receipt/${id}">View receipt</a></span>`;});
  on("loan",(d)=>{state.loans.unshift({product:String(d.get("product")),amount:Number(d.get("amount")),status:"Pending"});save();render();});
  on("profile",(d)=>{state.profile={name:String(d.get("name")),email:String(d.get("email")),phone:String(d.get("phone")||"")};save();document.getElementById("msg").innerHTML='<span class="ok">Saved on this device.</span>';});
  on("support",()=>{document.getElementById("msg").innerHTML='<span class="ok">Message saved in this browser.</span>';});
  on("kyc",()=>{state.kyc="Pending";save();document.getElementById("msg").innerHTML='<span class="ok">Status is now Pending.</span>';});
}
document.getElementById("burger").onclick=()=>document.getElementById("mnav").classList.toggle("hidden");
function loadCloudUser(uid){
  state.uid=uid;
  return db.collection("users").doc(uid).get().then((snap)=>{
    const data=snap.data();
    if(data){
      if(data.name) state.profile.name=data.name;
      if(data.email) state.profile.email=data.email;
      if(data.phone) state.profile.phone=data.phone;
      if(data.currency) state.currency=data.currency;
      if(data.account) state.account=Object.assign({}, state.account, data.account);
      if(Array.isArray(data.txs)) state.txs=data.txs;
      if(Array.isArray(data.cards)) state.cards=data.cards;
      if(Array.isArray(data.loans)) state.loans=data.loans;
    }
    state.signedIn=true;
    localStorage.setItem(KEY,JSON.stringify(state));
    go("dash");
  });
}
window.addEventListener("hashchange",render);
render();
if(useCloud){
  auth.onAuthStateChanged((user)=>{
    if(!user) return;
    state.uid=user.uid;
    db.collection("users").doc(user.uid).get().then((snap)=>{
      const data=snap.data();
      if(!data) return;
      state.profile.name=data.name||state.profile.name;
      state.profile.email=data.email||state.profile.email;
      state.profile.phone=data.phone||state.profile.phone;
      if(data.currency) state.currency=data.currency;
      if(data.account) state.account=Object.assign({}, state.account, data.account);
      if(Array.isArray(data.txs)) state.txs=data.txs;
      if(Array.isArray(data.cards)) state.cards=data.cards;
      if(Array.isArray(data.loans)) state.loans=data.loans;
      state.signedIn=true;
      localStorage.setItem(KEY,JSON.stringify(state));
      if(route()==="signin"||route()==="open") go("dash");
      else render();
    });
  });
}
